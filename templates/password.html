<div id="password-card" class="card {% if active_tab == 'password' %}active{% endif %}">
    <h3>🔐 Generatore & Tester Password</h3>
    <label>Lunghezza Password: <span id="pass-len-val">16</span></label>
    <input type="range" id="passLength" min="8" max="32" value="16" oninput="document.getElementById('pass-len-val').textContent = this.value">
    
    <button type="button" class="action-btn" onclick="generatePassword()" style="margin-bottom: 15px;">Genera Nuova Password</button>
    
    <input type="text" id="generatedPass" placeholder="La tua password apparirà qui..." readonly>
    <div id="passStrength" style="margin-top: 10px; font-weight: bold; font-size: 0.95rem;"></div>
</div>

<script>
function generatePassword() {
    const len = document.getElementById('passLength').value;
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=";
    let pass = "";
    for (let i = 0; i < len; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    const input = document.getElementById('generatedPass');
    input.value = pass;
    
    const strength = document.getElementById('passStrength');
    strength.style.color = '#22c55e';
    strength.textContent = `🛡️ Sicurezza: Molto Alta (Tempo di decifratura stimato: circa ${Math.pow(len, 3)} secoli)`;
}
</script>
