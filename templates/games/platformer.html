<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Super Mario Platformer</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        canvas { background: linear-gradient(to bottom, #60a5fa, #bfdbfe); border-radius: 8px; border: 3px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .hud { font-size: 1.2rem; margin-bottom: 10px; color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Super Mario Platformer</h1>
    <div class="hud">Monete raccolte: <span id="coins">0</span></div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <p>Controlli: <b>A / D</b> o <b>Frecce</b> per muoverti, <b>Spazio / W</b> per saltare.</p>
    <a href="/" style="color: #38bdf8; text-decoration: none;">&larr; Torna alla Home</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let coinsCount = 0;
        let player = { x: 50, y: 200, width: 28, height: 36, speed: 5, dx: 0, dy: 0, jumpPower: -11, gravity: 0.55, grounded: false };

        let platforms = [
            { x: 0, y: 350, width: 800, height: 50 },
            { x: 180, y: 270, width: 120, height: 20 },
            { x: 380, y: 200, width: 140, height: 20 },
            { x: 580, y: 260, width: 120, height: 20 }
        ];

        let coins = [
            { x: 220, y: 230, collected: false },
            { x: 440, y: 160, collected: false },
            { x: 630, y: 220, collected: false }
        ];

        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;
            else if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
            else player.dx = 0;

            if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }

            player.dy += player.gravity;
            player.x += player.dx;
            player.y += player.dy;

            player.grounded = false;
            platforms.forEach(p => {
                if (player.x < p.x + p.width && player.x + player.width > p.x &&
                    player.y + player.height > p.y && player.y + player.height - player.dy <= p.y) {
                    player.y = p.y - player.height;
                    player.dy = 0;
                    player.grounded = true;
                }
            });

            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + 14) - c.x, (player.y + 18) - c.y) < 20) {
                    c.collected = true;
                    coinsCount++;
                    document.getElementById('coins').innerText = coinsCount;
                }
            });

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y > canvas.height) { player.x = 50; player.y = 200; player.dy = 0; }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            platforms.forEach(p => {
                ctx.fillStyle = '#b91c1c';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#15803d';
                ctx.fillRect(p.x, p.y, p.width, 6);
            });

            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            ctx.fillStyle = '#dc2626';
            ctx.fillRect(player.x, player.y + 10, player.width, player.height - 10);
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(player.x + 4, player.y + 18, player.width - 8, player.height - 18);
            ctx.fillStyle = '#fde047';
            ctx.fillRect(player.x + 4, player.y, player.width - 8, 10);
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
