<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast - FoundmyIp</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #52796f; /* Verde salvia elegante stile screenshot */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .crown-score {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffb703;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .settings-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .main-score {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 5px 0 15px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Griglia di Gioco 8x8 */
        .grid-container {
            background: #3a5a40;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid #2f3e46;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }

        .cell {
            width: 38px;
            height: 38px;
            background: #2f3e46;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s;
        }

        /* Blocco pieno con effetto 3D */
        .cell.filled {
            background: #84a98c;
            border-top: 2px solid #a3b18a;
            border-left: 2px solid #a3b18a;
            border-right: 2px solid #588157;
            border-bottom: 2px solid #588157;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Dock dei pezzi in basso */
        .pieces-dock {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 10px;
            margin-bottom: 20px;
        }

        .mini-piece {
            display: grid;
            gap: 3px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: transform 0.15s;
        }

        .mini-piece:hover {
            transform: scale(1.08);
        }

        .mini-cell {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            background: transparent;
        }

        .mini-cell.active {
            background: #84a98c;
            border-top: 1.5px solid #a3b18a;
            border-left: 1.5px solid #a3b18a;
            border-right: 1.5px solid #588157;
            border-bottom: 1.5px solid #588157;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.4);
        }

        .back-link {
            color: #d8f3dc;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="game-header">
        <div class="crown-score">
            <span>👑</span> <span id="high-score">452948</span>
        </div>
        <button class="settings-btn" onclick="resetGame()">⚙️</button>
    </div>

    <div class="main-score" id="score">0</div>

    <!-- Griglia 8x8 -->
    <div class="grid-container">
        <div class="grid" id="grid"></div>
    </div>

    <!-- Sezione Pezzi -->
    <div class="pieces-dock" id="dock"></div>

    <a href="/" class="back-link">⬅ Torna alla Dashboard</a>

<script>
const GRID_SIZE = 8;
let gridData = [];
let score = 0;
let highScore = localStorage.getItem('blockblast_hi') || 452948;
document.getElementById('high-score').textContent = highScore;

let currentPieces = [];

// Forme geometriche avanzate stile Block Blast
const SHAPES = [
    [[1]], // Singolo
    [[1, 1]], // Linea 2
    [[1, 1, 1]], // Linea 3
    [[1, 1, 1, 1]], // Linea 4
    [[1, 1], [1, 1]], // Quadrato 2x2
    [[1, 0], [1, 1]], // L-shape
    [[0, 1], [1, 1]], // L invertita
    [[1, 1, 1], [0, 1, 0]], // T-shape
    [[1, 1, 0], [0, 1, 1]] // Z-shape
];

function initGrid() {
    gridData = [];
    for (let r = 0; r < GRID_SIZE; r++) {
        gridData[r] = [];
        for (let c = 0; c < GRID_SIZE; c++) {
            gridData[r][c] = 0;
        }
    }
    renderGrid();
}

function renderGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell' + (gridData[r][c] ? ' filled' : '');
            // Clicca per posizionare il pezzo selezionato
            cell.onclick = () => tryPlacePiece(r, c);
            gridEl.appendChild(cell);
        }
    }
}

let selectedPieceIndex = null;

function generatePieces() {
    currentPieces = [];
    const dock = document.getElementById('dock');
    dock.innerHTML = '';

    for (let i = 0; i < 3; i++) {
        const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        currentPieces.push(shape);

        const pieceEl = document.createElement('div');
        pieceEl.className = 'mini-piece';
        pieceEl.style.gridTemplateColumns = `repeat(${shape[0].length}, 18px)`;
        
        shape.forEach(row => {
            row.forEach(val => {
                const mCell = document.createElement('div');
                mCell.className = 'mini-cell' + (val ? ' active' : '');
                pieceEl.appendChild(mCell);
            });
        });

        pieceEl.onclick = () => {
            selectedPieceIndex = i;
            highlightPiece(i);
        };
        dock.appendChild(pieceEl);
    }
}

function highlightPiece(index) {
    const dockItems = document.getElementById('dock').children;
    for (let i = 0; i < dockItems.length; i++) {
        dockItems[i].style.background = (i === index) ? 'rgba(255,255,255,0.15)' : 'transparent';
    }
}

function tryPlacePiece(r, c) {
    if (selectedPieceIndex === null || !currentPieces[selectedPieceIndex]) return;
    const shape = currentPieces[selectedPieceIndex];

    // Controlla se il pezzo entra nei limiti della griglia e non si sovrappone
    let canPlace = true;
    for (let pr = 0; pr < shape.length; pr++) {
        for (let pc = 0; pc < shape[pr].length; pc++) {
            if (shape[pr][pc]) {
                let targetR = r + pr;
                let targetC = c + pc;
                if (targetR >= GRID_SIZE || targetC >= GRID_SIZE || gridData[targetR][targetC] !== 0) {
                    canPlace = false;
                }
            }
        }
    }

    if (canPlace) {
        // Inserisci il pezzo nella griglia
        for (let pr = 0; pr < shape.length; pr++) {
            for (let pc = 0; pc < shape[pr].length; pc++) {
                if (shape[pr][pc]) {
                    gridData[r + pr][c + pc] = 1;
                }
            }
        }

        score += shape.flat().reduce((a, b) => a + b, 0) * 15;
        document.getElementById('score').textContent = score;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('blockblast_hi', highScore);
            document.getElementById('high-score').textContent = highScore;
        }

        currentPieces[selectedPieceIndex] = null;
        selectedPieceIndex = null;

        checkClears();
        renderGrid();

        // Se tutti e 3 i pezzi sono stati usati, genera un nuovo set!
        if (currentPieces.every(p => p === null)) {
            generatePieces();
        }
    }
}

function checkClears() {
    // Controlla righe complete
    for (let r = 0; r < GRID_SIZE; r++) {
        if (gridData[r].every(cell => cell === 1)) {
            gridData[r] = Array(GRID_SIZE).fill(0);
            score += 150;
        }
    }
    // Controlla colonne complete
    for (let c = 0; c < GRID_SIZE; c++) {
        let fullCol = true;
        for (let r = 0; r < GRID_SIZE; r++) {
            if (gridData[r][c] === 0) fullCol = false;
        }
        if (fullCol) {
            for (let r = 0; r < GRID_SIZE; r++) gridData[r][c] = 0;
            score += 150;
        }
    }
    document.getElementById('score').textContent = score;
}

function resetGame() {
    score = 0;
    document.getElementById('score').textContent = score;
    selectedPieceIndex = null;
    initGrid();
    generatePieces();
}

// Avvio gioco
initGrid();
generatePieces();
</script>
</body>
</html>
