<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sblocca il Lucchetto - FoundmyIp</title>
    <style>
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            cursor: pointer;
            touch-action: manipulation;
        }

        .game-card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid #334155; 
            text-align: center; 
            width: 90%; 
            max-width: 400px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            pointer-events: none; /* Disattiva gli eventi interni per trasmettere il tap al body */
        }

        h1 { color: #8b5cf6; margin-top: 0; font-size: 1.5rem; }
        
        .lock-container { 
            position: relative; 
            width: 200px; 
            height: 200px; 
            margin: 20px auto; 
        }

        .circle { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 8px solid #334155; 
            position: relative; 
        }

        .target { 
            position: absolute; 
            width: 20px; 
            height: 20px; 
            background: #10b981; 
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
        }

        .pointer { 
            position: absolute; 
            width: 6px; 
            height: 90px; 
            background: #ef4444; 
            top: 10px; 
            left: 97px; 
            transform-origin: bottom center; 
            border-radius: 3px; 
        }

        .score-box { 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin: 15px 0; 
            color: #38bdf8; 
        }

        .tap-hint {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: 600;
        }

        .back-link { 
            display: inline-block; 
            margin-top: 25px; 
            color: #38bdf8; 
            text-decoration: none; 
            font-size: 0.95rem; 
            font-weight: bold;
            pointer-events: auto; /* Permette il click esclusivo sul pulsante di ritorno */
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 100;
        }

        .back-link:hover {
            text-decoration: underline;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body id="gameArea">

    <div class="game-card">
        <h1>🔓 Sblocca il Lucchetto</h1>
        <div class="score-box">LIVELLO: <span id="level">1</span></div>
        <div class="lock-container">
            <div class="circle">
                <div class="target" id="target"></div>
                <div class="pointer" id="pointer"></div>
            </div>
        </div>
        <div class="tap-hint">TOCCA IN QUALSIASI PUNTO PER SBLOCCARE!</div>
    </div>

    <!-- Pulsante per tornare indietro (protetto dai click del gioco) -->
    <a href="/" class="back-link" onclick="event.stopPropagation();">⬅ Torna alla Dashboard</a>

<script>
let level = 1;
let angle = 0;
let targetAngle = 90;
let speed = 2;
let direction = 1;
let isMoving = true;

function updateTarget() {
    targetAngle = Math.floor(Math.random() * 300) + 30;
    const rad = (targetAngle - 90) * (Math.PI / 180);
    const r = 86;
    const x = 100 + r * Math.cos(rad);
    const y = 100 + r * Math.sin(rad);
    const t = document.getElementById('target');
    t.style.left = x + 'px';
    t.style.top = y + 'px';
}

function gameLoop() {
    if (isMoving) {
        angle = (angle + speed * direction) % 360;
        if (angle < 0) angle += 360;
        document.getElementById('pointer').style.transform = `rotate(${angle}deg)`;
    }
    requestAnimationFrame(gameLoop);
}

function handleTap(e) {
    // Se il click avviene sul link di ritorno, non eseguire la logica del gioco
    if (e.target.closest('.back-link')) return;

    const diff = Math.abs(angle - targetAngle);
    if (diff <= 15 || diff >= 345) {
        level++;
        speed += 0.5;
        direction *= -1;
        document.getElementById('level').textContent = level;
        updateTarget();
    } else {
        alert('❌ Sbagliato! Ricominci dal livello 1');
        level = 1;
        speed = 2;
        document.getElementById('level').textContent = level;
        updateTarget();
    }
}

// Ascolta i tap o click su tutta la schermata
document.body.addEventListener('pointerdown', handleTap);

updateTarget();
gameLoop();
</script>
</body>
</html>
