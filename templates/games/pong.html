<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pong Online Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { padding: 8px 15px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
        canvas { background: #020617; border-radius: 8px; border: 2px solid #334155; }
    </style>
</head>
<body>
    <h1>PONG MULTIPLAYER ONLINE</h1>
    <div class="card">
        <div>ID Stanza: <b id="my-id" style="color: #38bdf8;">Generazione...</b></div>
        <br>
        <input type="text" id="join-id" placeholder="ID Avversario">
        <button onclick="connectToPeer()">Connetti</button>
        <div id="status" style="margin-top: 10px; color: #f59e0b;">In attesa...</div>
    </div>
    <canvas id="pongCanvas" width="800" height="400"></canvas>
    <br>
    <a href="/" style="color: #38bdf8; text-decoration: none;">&larr; Torna alla Home</a>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const paddleWidth = 12, paddleHeight = 80;
        let player1 = { x: 20, y: 160, score: 0 };
        let player2 = { x: 768, y: 160, score: 0 };
        let ball = { x: 400, y: 200, radius: 8, speedX: 5, speedY: 4 };
        let peer = null, conn = null, isHost = true, gameStarted = false;
        const keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function initPeer() {
            peer = new Peer();
            peer.on('open', id => document.getElementById('my-id').innerText = id);
            peer.on('connection', connection => { conn = connection; isHost = true; setupConn(); });
        }

        function connectToPeer() {
            const peerId = document.getElementById('join-id').value.trim();
            if (!peerId) return;
            conn = peer.connect(peerId);
            isHost = false;
            setupConn();
        }

        function setupConn() {
            conn.on('open', () => {
                document.getElementById('status').innerText = "Connesso!";
                gameStarted = true;
            });
            conn.on('data', data => {
                if (isHost) {
                    if (data.type === 'input') player2.y = data.paddleY;
                } else {
                    if (data.type === 'state') {
                        player1.y = data.p1Y; player2.y = data.p2Y;
                        ball.x = data.ballX; ball.y = data.ballY;
                        player1.score = data.p1Score; player2.score = data.p2Score;
                    }
                }
            });
        }

        function update() {
            if (!gameStarted) return;
            if (isHost) {
                if (keys['KeyW'] || keys['ArrowUp']) player1.y -= 7;
                if (keys['KeyS'] || keys['ArrowDown']) player1.y += 7;
                player1.y = Math.max(0, Math.min(canvas.height - paddleHeight, player1.y));

                ball.x += ball.speedX; ball.y += ball.speedY;
                if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) ball.speedY *= -1;

                if (ball.x - ball.radius <= player1.x + paddleWidth && ball.y >= player1.y && ball.y <= player1.y + paddleHeight) {
                    ball.speedX = Math.abs(ball.speedX) * 1.05;
                }
                if (ball.x + ball.radius >= player2.x && ball.y >= player2.y && ball.y <= player2.y + paddleHeight) {
                    ball.speedX = -Math.abs(ball.speedX) * 1.05;
                }

                if (ball.x < 0) { player2.score++; ball.x = 400; ball.y = 200; }
                if (ball.x > canvas.width) { player1.score++; ball.x = 400; ball.y = 200; }

                if (conn && conn.open) {
                    conn.send({ type: 'state', p1Y: player1.y, p2Y: player2.y, ballX: ball.x, ballY: ball.y, p1Score: player1.score, p2Score: player2.score });
                }
            } else {
                let myY = player2.y;
                if (keys['KeyW'] || keys['ArrowUp']) myY -= 7;
                if (keys['KeyS'] || keys['ArrowDown']) myY += 7;
                myY = Math.max(0, Math.min(canvas.height - paddleHeight, myY));
                if (conn && conn.open) conn.send({ type: 'input', paddleY: myY });
            }
        }

        function draw() {
            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '36px monospace'; ctx.fillStyle = '#64748b';
            ctx.fillText(player1.score, 200, 50); ctx.fillText(player2.score, 600, 50);

            ctx.fillStyle = '#38bdf8'; ctx.fillRect(player1.x, player1.y, paddleWidth, paddleHeight);
            ctx.fillStyle = '#f43f5e'; ctx.fillRect(player2.x, player2.y, paddleWidth, paddleHeight);
            ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        initPeer(); loop();
    </script>
</body>
</html>
