<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indovina la Bandiera - FoundmyIp</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            color: #38bdf8;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .stats span {
            color: #f59e0b;
        }

        .flag-box {
            width: 100%;
            height: 200px;
            background: #1e293b;
            border-radius: 12px;
            border: 3px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .flag-img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background: #1e293b;
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            border-color: #38bdf8;
            background: #334155;
        }

        .option-btn.correct {
            background: #166534 !important;
            border-color: #22c55e !important;
            color: #ffffff;
        }

        .option-btn.wrong {
            background: #991b1b !important;
            border-color: #ef4444 !important;
            color: #ffffff;
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .message-box {
            height: 30px;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .back-btn {
            margin-top: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🌐 Indovina la Bandiera</h1>

    <div class="stats">
        <div>PUNTI: <span id="score">0</span></div>
        <div>RECORD: <span id="high-score">0</span></div>
    </div>

    <div class="flag-box">
        <img id="flagImage" class="flag-img" src="" alt="Bandiera">
    </div>

    <div class="options-container" id="optionsContainer">
        <button class="option-btn" onclick="checkAnswer(0)">
            <span class="opt-text">Opzione A</span>
            <span class="badge">A</span>
        </button>
        <button class="option-btn" onclick="checkAnswer(1)">
            <span class="opt-text">Opzione B</span>
            <span class="badge">B</span>
        </button>
        <button class="option-btn" onclick="checkAnswer(2)">
            <span class="opt-text">Opzione C</span>
            <span class="badge">C</span>
        </button>
    </div>

    <div class="message-box" id="message"></div>

    <a href="/" class="back-btn">⬅ Torna alla Dashboard</a>
</div>

<script>
// Database Bandiere ISO del mondo in Italiano
const FLAGS = [
    { code: 'it', name: 'Italia' }, { code: 'fr', name: 'Francia' }, { code: 'de', name: 'Germania' },
    { code: 'es', name: 'Spagna' }, { code: 'gb', name: 'Regno Unito' }, { code: 'us', name: 'Stati Uniti' },
    { code: 'jp', name: 'Giappone' }, { code: 'br', name: 'Brasile' }, { code: 'ar', name: 'Argentina' },
    { code: 'ca', name: 'Canada' }, { code: 'au', name: 'Australia' }, { code: 'pt', name: 'Portogallo' },
    { code: 'nl', name: 'Paesi Bassi' }, { code: 'be', name: 'Belgio' }, { code: 'ch', name: 'Svizzera' },
    { code: 'gr', name: 'Grecia' }, { code: 'se', name: 'Svezia' }, { code: 'no', name: 'Norvegia' },
    { code: 'fi', name: 'Finlandia' }, { code: 'dk', name: 'Danimarca' }, { code: 'pl', name: 'Polonia' },
    { code: 'ro', name: 'Romania' }, { code: 'mx', name: 'Messico' }, { code: 'co', name: 'Colombia' },
    { code: 'cl', name: 'Cile' }, { code: 'pe', name: 'Perù' }, { code: 'cn', name: 'Cina' },
    { code: 'in', name: 'India' }, { code: 'kr', name: 'Corea del Sud' }, { code: 'za', name: 'Sudafrica' },
    { code: 'eg', name: 'Egitto' }, { code: 'ma', name: 'Marocco' }, { code: 'tr', name: 'Turchia' },
    { code: 'sa', name: 'Arabia Saudita' }, { code: 'ae', name: 'Emirati Arabi Uniti' }, { code: 'ru', name: 'Russia' },
    { code: 'ua', name: 'Ucraina' }, { code: 'at', name: 'Austria' }, { code: 'ie', name: 'Irlanda' },
    { code: 'nz', name: 'Nuova Zelanda' }, { code: 'uy', name: 'Uruguay' }, { code: 'hr', name: 'Croazia' },
    { code: 'sr', name: 'Serbia' }, { code: 'hu', name: 'Ungheria' }, { code: 'cz', name: 'Repubblica Ceca' },
    { code: 'sk', name: 'Slovacchia' }, { code: 'bg', name: 'Bulgaria' }, { code: 'th', name: 'Thailandia' },
    { code: 'vn', name: 'Vietnam' }, { code: 'id', name: 'Indonesia' }, { code: 'ph', name: 'Filippine' },
    { code: 'my', name: 'Malesia' }, { code: 'sg', name: 'Singapore' }, { code: 'is', name: 'Islanda' },
    { code: 'cu', name: 'Cuba' }, { code: 'jm', name: 'Giammapica' }, { code: 'ke', name: 'Kenya' },
    { code: 'ng', name: 'Nigeria' }, { code: 'al', name: 'Albania' }, { code: 'dz', name: 'Algeria' }
];

let score = 0;
let highScore = localStorage.getItem('flag_highscore') || 0;
document.getElementById('high-score').textContent = highScore;

let currentCorrectIndex = 0;
let options = [];
let isAnsweringAllowed = true;

// Suoni sintetizzati sintetici tramite Web Audio API
let audioCtx = null;
function playSound(type) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    } catch(e) {}
}

function loadNewFlag() {
    isAnsweringAllowed = true;
    document.getElementById('message').textContent = '';
    
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => {
        b.classList.remove('correct', 'wrong');
    });

    // Seleziona paese corretto casuale
    const correctCountry = FLAGS[Math.floor(Math.random() * FLAGS.length)];
    
    // Seleziona altri 2 paesi diversi per le opzioni errate
    let wrong1, wrong2;
    do {
        wrong1 = FLAGS[Math.floor(Math.random() * FLAGS.length)];
    } while (wrong1.code === correctCountry.code);

    do {
        wrong2 = FLAGS[Math.floor(Math.random() * FLAGS.length)];
    } while (wrong2.code === correctCountry.code || wrong2.code === wrong1.code);

    options = [correctCountry, wrong1, wrong2];
    // Mescola le 3 opzioni
    options.sort(() => Math.random() - 0.5);

    currentCorrectIndex = options.findIndex(o => o.code === correctCountry.code);

    // Carica immagine della bandiera (SVG da flagcdn.com)
    const img = document.getElementById('flagImage');
    img.src = `https://flagcdn.com/w320/${correctCountry.code}.png`;

    // Aggiorna testo dei pulsanti
    const optTexts = document.querySelectorAll('.opt-text');
    for (let i = 0; i < 3; i++) {
        optTexts[i].textContent = options[i].name;
    }
}

function checkAnswer(selectedIndex) {
    if (!isAnsweringAllowed) return;
    isAnsweringAllowed = false;

    const btns = document.querySelectorAll('.option-btn');
    const msg = document.getElementById('message');

    if (selectedIndex === currentCorrectIndex) {
        btns[selectedIndex].classList.add('correct');
        score += 10;
        playSound('correct');
        msg.style.color = '#22c55e';
        msg.textContent = '✨ Esatto! +10 punti';

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('flag_highscore', highScore);
            document.getElementById('high-score').textContent = highScore;
        }
    } else {
        btns[selectedIndex].classList.add('wrong');
        btns[currentCorrectIndex].classList.add('correct');
        score = 0; // Azzera punteggio in caso di errore
        playSound('wrong');
        msg.style.color = '#ef4444';
        msg.textContent = `❌ Sbagliato! Era ${options[currentCorrectIndex].name}`;
    }

    document.getElementById('score').textContent = score;

    // Passa alla prossima bandiera dopo 1.5 secondi
    setTimeout(loadNewFlag, 1500);
}

// Avvio
loadNewFlag();
</script>
</body>
</html>
