<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indovina la Bandiera - Mondo</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #334155;
        }
        img.flag {
            width: 260px;
            height: auto;
            border-radius: 6px;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #334155;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        .score { font-size: 1.2rem; margin-bottom: 15px; color: #38bdf8; }
        #message { margin-top: 15px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Indovina la Bandiera (Mondo)</h1>
        <div class="score">Punteggio: <span id="score">0</span></div>
        <div id="game-area">
            <img id="flag-img" class="flag" src="" alt="Bandiera">
            <div class="options" id="options-container"></div>
        </div>
        <div id="message"></div>
        <br>
        <a href="/" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">&larr; Torna alla Home</a>
    </div>

            { code: 'to', name: 'Tonga' }, { code: 'tt', name: 'Trinidad e Tobago' }, { code: 'tn', name: 'Tunisia' },
            { code: 'tr', name: 'Turchia' }, { code: 'tm', name: 'Turkmenistan' }, { code: 'tv', name: 'Tuvalu' },
            { code: 'ug', name: 'Uganda' }, { code: 'ua', name: 'Ucraina' }, { code: 'ae', name: 'Emirati Arabi Uniti' },
            { code: 'gb', name: 'Regno Unito' }, { code: 'us', name: 'Stati Uniti' }, { code: 'uy', name: 'Uruguay' },
            { code: 'uz', name: 'Uzbekistan' }, { code: 'vu', name: 'Vanuatu' }, { code: 'va', name: 'Città del Vaticano' },
            { code: 've', name: 'Venezuela' }, { code: 'vn', name: 'Vietnam' }, { code: 'ye', name: 'Yemen' },
            { code: 'zm', name: 'Zambia' }, { code: 'zw', name: 'Zimbabwe' }
        ];

        let score = 0;
        let currentCountry = {};

        function nextQuestion() {
            document.getElementById('message').innerText = '';
            // Seleziona un paese casuale tra tutti quelli presenti nella lista mondiale
            currentCountry = countries[Math.floor(Math.random() * countries.length)];
            document.getElementById('flag-img').src = `https://flagcdn.com/w320/${currentCountry.code}.png`;

            // Crea 4 opzioni (1 corretta + 3 casuali errate)
            let options = [currentCountry];
            while (options.length < 4) {
                let randomCountry = countries[Math.floor(Math.random() * countries.length)];
                if (!options.some(opt => opt.code === randomCountry.code)) {
                    options.push(randomCountry);
                }
            }
            // Mischia le opzioni
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            options.exports = options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt.name;
                btn.onclick = () => checkAnswer(opt.code);
                container.appendChild(btn);
            });
        }

        function checkAnswer(code) {
            const msg = document.getElementById('message');
            if (code === currentCountry.code) {
                score++;
                document.getElementById('score').innerText = score;
                msg.style.color = '#10b981';
                msg.innerText = 'Corretto! Ottimo lavoro.';
            } else {
                msg.style.color = '#f43f5e';
                msg.innerText = `Sbagliato! Era ${currentCountry.name}.`;
            }
            setTimeout(nextQuestion, 1500);
        }

        nextQuestion();
    </script>
</body>
</html>
