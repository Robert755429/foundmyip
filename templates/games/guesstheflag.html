<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indovina la Bandiera</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 500px; width: 90%; border: 1px solid #334155; }
        img.flag { width: 250px; height: auto; border-radius: 6px; margin: 20px 0; border: 2px solid #334155; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #2563eb; }
        .score { font-size: 1.2rem; margin-bottom: 15px; color: #38bdf8; }
        #message { margin-top: 15px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Indovina la Bandiera (Mondo)</h1>
        <div class="score">Punteggio: <span id="score">0</span></div>
        <div id="game-area">
            <img id="flag-img" class="flag" src="" alt="Bandiera">
            <div class="options" id="options-container"></div>
        </div>
        <div id="message"></div>
        <br>
        <a href="/" style="color: #94a3b8; text-decoration: none;">&larr; Torna alla Home</a>
    </div>

    <script>
        const countries = [
            { code: 'it', name: 'Italia' }, { code: 'fr', name: 'Francia' }, { code: 'es', name: 'Spagna' },
            { code: 'de', name: 'Germania' }, { code: 'gb', name: 'Regno Unito' }, { code: 'us', name: 'Stati Uniti' },
            { code: 'br', name: 'Brasile' }, { code: 'jp', name: 'Giappone' }, { code: 'ca', name: 'Canada' },
            { code: 'ar', name: 'Argentina' }, { code: 'au', name: 'Australia' }, { code: 'cn', name: 'Cina' },
            { code: 'eg', name: 'Egitto' }, { code: 'gr', name: 'Grecia' }, { code: 'mx', name: 'Messico' },
            { code: 'pt', name: 'Portogallo' }, { code: 'ch', name: 'Svizzera' }, { code: 'nl', name: 'Paesi Bassi' }
        ];

        let score = 0;
        let currentCountry = {};

        function nextQuestion() {
            document.getElementById('message').innerText = '';
            currentCountry = countries[Math.floor(Math.random() * countries.length)];
            document.getElementById('flag-img').src = `https://flagcdn.com/w320/${currentCountry.code}.png`;

            let options = [currentCountry];
            while (options.length < 4) {
                let randomCountry = countries[Math.floor(Math.random() * countries.length)];
                if (!options.some(opt => opt.code === randomCountry.code)) {
                    options.push(randomCountry);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt.name;
                btn.onclick = () => checkAnswer(opt.code);
                container.appendChild(btn);
            });
        }

        function checkAnswer(code) {
            const msg = document.getElementById('message');
            if (code === currentCountry.code) {
                score++;
                document.getElementById('score').innerText = score;
                msg.style.color = '#10b981';
                msg.innerText = 'Corretto!';
            } else {
                msg.style.color = '#f43f5e';
                msg.innerText = `Sbagliato! Era ${currentCountry.name}.`;
            }
            setTimeout(nextQuestion, 1500);
        }

        nextQuestion();
    </script>
</body>
</html>
