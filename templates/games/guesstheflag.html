let score = 0;

function openModal() { document.getElementById('ruleModal').style.display = 'flex'; }
function closeModal() { document.getElementById('ruleModal').style.display = 'none'; }

function loadQuiz() {
    const target = allCountries[Math.floor(Math.random() * allCountries.length)];
    document.getElementById('flagDisplay').textContent = target.flag;
    
    let options = [target.name];
    while(options.length < 4) {
        let randomCountry = allCountries[Math.floor(Math.random() * allCountries.length)].name;
        if(!options.includes(randomCountry)) {
            options.push(randomCountry);
        }
    }
    
    options.sort(() => Math.random() - 0.5);
    
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    
    options.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = () => {
            if(opt === target.name) {
                score += 10;
            } else {
                score = Math.max(0, score - 5);
            }
            document.getElementById('score').textContent = score;
            loadQuiz();
        };
        container.appendChild(btn);
    });
}
