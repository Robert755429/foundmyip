<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tris - FoundmyIp</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; position: relative; }
        .gear-btn { position: absolute; top: 15px; right: 15px; background: #1e293b; border: 1px solid #334155; color: #f8fafc; font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: background 0.2s; }
        .gear-btn:hover { background: #334155; }
        .game-card { background: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid #334155; text-align: center; width: 90%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #ec4899; margin: 0 0 10px 0; font-size: 1.4rem; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #090d16; padding: 10px; border-radius: 12px; border: 2px solid #334155; aspect-ratio: 1; margin: 15px 0; }
        .cell { background: #334155; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; border-radius: 8px; cursor: pointer; color: #fff; transition: background 0.2s; }
        .cell:hover { background: #475569; }
        .status { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #38bdf8; }
        .back-link { display: inline-block; margin-top: 10px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .back-link:hover { color: #38bdf8; text-decoration: underline; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 350px; border: 1px solid #334155; text-align: left; }
        .modal-content h3 { color: #ec4899; margin-top: 0; }
        .modal-close { background: #ec4899; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; float: right; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <button class="gear-btn" onclick="openModal()">⚙️</button>

    <div class="game-card">
        <h1>❌ Tris ⭕</h1>
        <div class="status" id="statusText">Tocca a X</div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <a href="/" class="back-link">⬅ Torna alla Dashboard</a>
    </div>

    <div id="ruleModal" class="modal">
        <div class="modal-content">
            <h3>⚙️ Istruzioni Tris</h3>
            <p>1. Gioca a turni posizionando la tua X o O.</p>
            <p>2. Allinea tre simboli in orizzontale, verticale o diagonale per vincere.</p>
            <p>3. Clicca su una casella libera per muovere.</p>
            <button class="modal-close" onclick="closeModal()">Capito!</button>
        </div>
    </div>

<script>
let board = ['', '', '', '', '', '', '', '', ''];
let currentPlayer = 'X';
let isGameActive = true;

function openModal() { document.getElementById('ruleModal').style.display = 'flex'; }
function closeModal() { document.getElementById('ruleModal').style.display = 'none'; }

const winningConditions = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
];

function makeMove(idx) {
    if(board[idx] !== '' || !isGameActive) return;
    board[idx] = currentPlayer;
    document.querySelectorAll('.cell')[idx].textContent = currentPlayer;
    
    checkResult();
}

function checkResult() {
    let roundWon = false;
    for(let condition of winningConditions) {
        let a = board[condition[0]], b = board[condition[1]], c = board[condition[2]];
        if(a === '' || b === '' || c === '') continue;
        if(a === b && b === c) { roundWon = true; break; }
    }

    if(roundWon) {
        document.getElementById('statusText').textContent = `Vince ${currentPlayer}! 🎉`;
        isGameActive = false;
        setTimeout(resetGame, 2500);
        return;
    }

    if(!board.includes('')) {
        document.getElementById('statusText').textContent = "Pareggio! 🤝";
        isGameActive = false;
        setTimeout(resetGame, 2500);
        return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    document.getElementById('statusText').textContent = `Tocca a ${currentPlayer}`;
}

function resetGame() {
    board = ['', '', '', '', '', '', '', '', ''];
    isGameActive = true;
    currentPlayer = 'X';
    document.getElementById('statusText').textContent = `Tocca a X`;
    document.querySelectorAll('.cell').forEach(cell => cell.textContent = '');
}
</script>
</body>
</html>
