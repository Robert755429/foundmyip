<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sblocca il Lucchetto - FoundmyIp</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; touch-action: manipulation; }
        .game-card { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #8b5cf6; margin-top: 0; font-size: 1.5rem; }
        .lock-container { position: relative; width: 200px; height: 200px; margin: 20px auto; cursor: pointer; }
        .circle { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #334155; position: relative; }
        .target { position: absolute; width: 24px; height: 24px; background: #10b981; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #10b981; }
        .pointer { position: absolute; width: 12px; height: 90px; background: #ef4444; top: 10px; left: 94px; transform-origin: bottom center; border-radius: 6px; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
        .score-box { font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: #38bdf8; }
        .btn-tap { background: #8b5cf6; color: white; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-tap:active { background: #7c3aed; }
        .back-link { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .back-link:hover { color: #38bdf8; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="game-card">
        <h1>🔓 Sblocca il Lucchetto</h1>
        <div class="score-box">LIVELLO: <span id="level">1</span></div>
        <div class="lock-container" onclick="handleTap()">
            <div class="circle">
                <div class="target" id="target"></div>
                <div class="pointer" id="pointer"></div>
            </div>
        </div>
        <button class="btn-tap" onclick="handleTap()">SBLOCCA!</button>
        <a href="/" class="back-link">⬅ Torna alla Dashboard</a>
    </div>

<script>
let level = 1;
let angle = 0;
let targetAngle = 90;
let speed = 2;
let direction = 1;
let isMoving = true;

function updateTarget() {
    targetAngle = Math.floor(Math.random() * 300) + 30;
    const rad = (targetAngle - 90) * (Math.PI / 180);
    const r = 86;
    const x = 100 + r * Math.cos(rad);
    const y = 100 + r * Math.sin(rad);
    const t = document.getElementById('target');
    t.style.left = x + 'px';
    t.style.top = y + 'px';
}

function gameLoop() {
    if (isMoving) {
        angle = (angle + speed * direction) % 360;
        if (angle < 0) angle += 360;
        document.getElementById('pointer').style.transform = `rotate(${angle}deg)`;
    }
    requestAnimationFrame(gameLoop);
}

function handleTap() {
    const diff = Math.abs(angle - targetAngle);
    if (diff <= 22 || diff >= 338) {
        level++;
        speed += 0.3;
        direction *= -1;
        document.getElementById('level').textContent = level;
        updateTarget();
    } else {
        level = 1;
        speed = 2;
        document.getElementById('level').textContent = level;
        updateTarget();
    }
}

updateTarget();
gameLoop();
</script>
</body>
</html>
