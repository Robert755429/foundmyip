<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sblocca il Lucchetto Infinito - FoundmyIp</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #8b5cf6;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #334155;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stats span {
            color: #38bdf8;
        }

        #lockCanvas {
            background: #1e293b;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.5);
            border: 4px solid #334155;
            cursor: pointer;
            touch-action: manipulation;
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .back-btn {
            margin-top: 25px;
            color: #8b5cf6;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
