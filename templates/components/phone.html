<div id="phone-card" class="card {% if active_tab == 'phone' %}active{% endif %}">
    <h3 data-i18n="phone_title">Analizzatore Numeri</h3>
    <form method="POST" action="/phone">
        <label data-i18n="phone_label">Inserisci Numero (es. +39XXXXXXXXXX)</label>
        <input type="text" name="phone" placeholder="+39..." required>
        <button type="submit" class="action-btn" data-i18n="phone_btn">Avvia Analisi Telefono</button>
    </form>
    {% include 'components/updates_block.html' %}
</div>
