<div id="updates-block" style="margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 15px; position: relative;">
    <button type="button" onclick="dismissUpdatesBlock()" style="position: absolute; top: 12px; right: 0; background: transparent; border: none; color: #94a3b8; font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 4px 8px;">✕</button>
    <h4 style="margin: 0 0 10px 0; color: var(--accent-color); font-size: 0.9rem;">🚀 Storico Aggiornamenti</h4>
    <div style="max-height: 140px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); text-align: left;">
        <div style="margin-bottom: 10px; border-left: 3px solid var(--accent-color); padding-left: 8px;">
            <strong style="font-size: 0.8rem; color: var(--accent-color);">v4.0.0 Pro (Ultimate Edition) - Ottobre 2026</strong>
            <ul style="margin: 3px 0 0 0; padding-left: 15px; font-size: 0.75rem; color: #cbd5e1; line-height: 1.3;">
                <li>Integrazione WAF Firewall avanzato con Auto-Ban.</li>
                <li>Modulo Antivirus & Malware Scanner integrato.</li>
                <li>Traduzione multilingua automatica in tempo reale.</li>
            </ul>
        </div>
    </div>
</div>
<script>
function dismissUpdatesBlock() {
    document.querySelectorAll('#updates-block').forEach(b => b.style.display = 'none');
    localStorage.setItem('updates_dismissed', 'true');
}
if (localStorage.getItem('updates_dismissed') === 'true') {
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll('#updates-block').forEach(b => b.style.display = 'none');
    });
}
</script>
