<!DOCTYPE html>
<html lang="it" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoundmyIp v4.0.0 Pro</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc;
            --accent-color: #8b5cf6; --accent-hover: #7c3aed; --input-bg: #090d16; --border-color: #334155;
        }
        body.theme-matrix { --bg-color: #022c22; --card-bg: #064e3b; --accent-color: #10b981; --accent-hover: #059669; }
        body.theme-ocean { --bg-color: #082f49; --card-bg: #0369a1; --accent-color: #38bdf8; --accent-hover: #0ea5e9; }
        body.theme-light { --bg-color: #f1f5f9; --card-bg: #ffffff; --text-color: #0f172a; --accent-color: #6366f1; --accent-hover: #4f46e5; --input-bg: #f8fafc; --border-color: #cbd5e1; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; min-height: 100vh; }
        
        /* BARRA LATERALE (SIDEBAR) */
        .sidebar { width: 240px; background: var(--card-bg); border-right: 1px solid var(--border-color); padding: 20px 10px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .sidebar h2 { font-size: 1.2rem; color: var(--accent-color); margin: 0 0 15px 10px; }
        .side-btn { padding: 12px 15px; background: transparent; border: 1px solid transparent; color: var(--text-color); font-weight: 600; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; transition: all 0.2s; }
        .side-btn:hover, .side-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        
        /* CONTENUTO PRINCIPALE */
        .main-wrapper { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .container { width: 100%; max-width: 750px; flex: 1; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 12px 18px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; }
        .header-controls { display: flex; align-items: center; gap: 8px; }
        .control-select { background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; }
        
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); border: 1px solid var(--border-color); margin-bottom: 20px; display: none; }
        .card.active { display: block; }
        h3 { margin-top: 0; color: var(--accent-color); }
        input, select.input-box { width: 100%; padding: 12px; margin: 8px 0 16px 0; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
        button.action-btn { width: 100%; padding: 14px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background: var(--accent-hover); }
        
        /* STILI MINIGIOCHI VERTICALI PULITI */
        .games-list-container { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .game-card-item { display: block; padding: 15px 20px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; text-decoration: none; font-weight: bold; font-size: 1rem; transition: transform 0.2s, border-color 0.2s; }
        .game-card-item:hover { transform: translateY(-2px); border-color: var(--accent-color); }

        /* RESPONSIVE PER SMARTPHONE */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); flex-direction: row; overflow-x: auto; padding: 10px; }
            .sidebar h2 { display: none; }
            .side-btn { white-space: nowrap; font-size: 0.8rem; padding: 8px 12px; }
        }
    </style>
</head>
<body class="{{ theme }}">
    <!-- BARRA LATERALE -->
    <div class="sidebar">
        <h2>🌐 FoundmyIp</h2>
        <button class="side-btn {% if active_tab == 'phone' %}active{% endif %}" onclick="switchTab('phone')">📱 Telefono</button>
        <button class="side-btn {% if active_tab == 'ip' %}active{% endif %}" onclick="switchTab('ip')">🌐 IP Lookup</button>
        <button class="side-btn {% if active_tab == 'myip' %}active{% endif %}" onclick="switchTab('myip')">📍 Il Mio IP</button>
        <button class="side-btn {% if active_tab == 'password' %}active{% endif %}" onclick="switchTab('password')">🔐 Password</button>
        <button class="side-btn {% if active_tab == 'qrcode' %}active{% endif %}" onclick="switchTab('qrcode')">📷 QR Code</button>
        <button class="side-btn {% if active_tab == 'speedtest' %}active{% endif %}" onclick="switchTab('speedtest')">⚡ Speed Test</button>
        <button class="side-btn {% if active_tab == 'antivirus' %}active{% endif %}" onclick="switchTab('antivirus')">🛡️ Antivirus</button>
        <button class="side-btn {% if active_tab == 'games' %}active{% endif %}" onclick="switchTab('games')">🕹️ Minigiochi</button>
        <button class="side-btn {% if active_tab == 'auth' %}active{% endif %}" onclick="switchTab('auth')">👤 Login / Registrati</button>
        <button class="side-btn {% if active_tab == 'submit' %}active{% endif %}" onclick="switchTab('submit')">💡 Feedback</button>
        <button class="side-btn {% if active_tab == 'admin' %}active{% endif %}" onclick="switchTab('admin')">🔐 Admin</button>
    </div>

    <!-- AREA CONTENUTI -->
    <div class="main-wrapper">
        <div class="container">
            <header>
                <h1 style="font-size:1.1rem; margin:0; color:var(--accent-color);">FoundmyIp v4.0.0 Pro</h1>
                <div class="header-controls">
                    <select id="themeSelect" class="control-select" onchange="changeTheme(this.value)">
                        <option value="cyber">🎨 Cyber</option>
                        <option value="matrix">Matrix</option>
                        <option value="ocean">Ocean</option>
                        <option value="light">Light</option>
                    </select>
                </div>
            </header>
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='translations.js') }}"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
            const card = document.getElementById(tab + '-card');
            if(card) card.classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
