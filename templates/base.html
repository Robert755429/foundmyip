<!DOCTYPE html>
<html lang="it" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoundmyIp v4.0.0 Pro</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc;
            --accent-color: #8b5cf6; --accent-hover: #7c3aed; --input-bg: #090d16; --border-color: #334155;
        }
        body.theme-matrix { --bg-color: #022c22; --card-bg: #064e3b; --accent-color: #10b981; --accent-hover: #059669; }
        body.theme-ocean { --bg-color: #082f49; --card-bg: #0369a1; --accent-color: #38bdf8; --accent-hover: #0ea5e9; }
        body.theme-light { --bg-color: #f1f5f9; --card-bg: #ffffff; --text-color: #0f172a; --accent-color: #6366f1; --accent-hover: #4f46e5; --input-bg: #f8fafc; --border-color: #cbd5e1; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: background 0.3s ease; }
        .container { width: 100%; max-width: 700px; flex: 1; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 12px 18px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.3rem; margin: 0; color: var(--accent-color); font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .header-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .control-select { background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 600; outline: none; }
        .top-scroll-nav { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: thin; scrollbar-color: var(--accent-color) var(--card-bg); }
        .top-scroll-nav::-webkit-scrollbar { height: 6px; }
        .tab-btn { padding: 12px; text-align: center; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-weight: bold; border-radius: 10px; cursor: pointer; text-decoration: none; font-size: 0.85rem; flex: 0 0 auto; min-width: 100px; }
        .tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); border: 1px solid var(--border-color); margin-bottom: 20px; display: none; }
        .card.active { display: block; }
        h3 { margin-top: 0; color: var(--accent-color); }
        input, select.input-box { width: 100%; padding: 12px; margin: 8px 0 16px 0; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
        button.action-btn, a.action-btn { display: inline-block; text-align: center; width: 100%; padding: 14px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-decoration: none; }
        button.action-btn:hover, a.action-btn:hover { background: var(--accent-hover); }
        pre { background: #020617; color: #38bdf8; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 0.9rem; border: 1px solid var(--border-color); }
        .alert-error { background: #7f1d1d; color: #fca5a5; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        #cookie-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .cookie-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px; max-width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        footer { margin-top: auto; width: 100%; max-width: 700px; text-align: center; padding: 20px 0 10px 0; font-size: 0.8rem; color: #94a3b8; border-top: 1px solid var(--border-color); }
        footer a { color: var(--accent-color); text-decoration: none; margin: 0 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; max-width: 500px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border-color); }
        .modal-close { float: right; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body class="{{ theme }}">
    <div class="container">
        <header>
            <h1>🌐 FoundmyIp</h1>
            <div class="header-controls">
                <!-- Widget di Google Translate integrato -->
                <div id="google_translate_element"></div>

                <select id="themeSelect" class="control-select" onchange="changeTheme(this.value)">
                    <option value="cyber">🎨 Cyber</option><option value="matrix">Matrix</option>
                    <option value="ocean">Ocean</option><option value="light">Light</option>
                </select>
            </div>
        </header>
        {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
        {% block content %}{% endblock %}
    </div>
    <footer>
        <p>&copy; 2026 FoundmyIp. Tutti i diritti riservati.</p>
        <p>Licenza: <strong>MIT License</strong> | Copyright &copy; <strong>Nix</strong></p>
    </footer>

    <div id="cookie-overlay">
        <div class="cookie-box">
            <h3>🔒 Accettazione Cookie Richiesta</h3>
            <p>Per poter utilizzare FoundmyIp è necessario accettare i cookie tecnici.</p>
            <button class="action-btn" onclick="acceptCookies()">Accetta e Prosegui</button>
        </div>
    </div>

    <!-- Script Google Translate -->
    <script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'it',
            includedLanguages: 'it,en,es,pt,zh-CN,ar',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script src="{{ url_for('static', filename='translations.js') }}"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            const card = document.getElementById(tab + '-card');
            if(card) card.classList.add('active');
        }
    </script>
</body>
</html>
